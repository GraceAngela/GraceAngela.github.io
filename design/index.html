<style id="css">/* Layout: sticky nav; a split hero (big statement left, a 2×2 mosaic of project covers right); full-width project spreads
   that alternate sides, each with an illustrated cover in one of two inks (cobalt, marigold) until real photos are added. */
:root {
  --bg: #f5f4f8;
  --paper: #ffffff;
  --ink: #1d1829;
  --muted: #686277;
  --line: #e2e0ea;
  --blue: #2f48c8;
  --blue-soft: #e4e8fb;
  --gold: #e99f12;
  --gold-soft: #fcefd2;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131119; --paper: #1d1a26; --ink: #efedf5; --muted: #aaa4b9; --line: #2e2a3b;
    --blue: #8a9cff; --blue-soft: #222546; --gold: #f4b844; --gold-soft: #372c17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131119; --paper: #1d1a26; --ink: #efedf5; --muted: #aaa4b9; --line: #2e2a3b;
  --blue: #8a9cff; --blue-soft: #222546; --gold: #f4b844; --gold-soft: #372c17; color-scheme: dark;
}
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 76px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
.shell { max-width: 1200px; margin: 0 auto; padding-inline: 32px; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em; }

/* nav */
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.nav-in { display: flex; align-items: center; gap: 28px; height: 62px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; letter-spacing: -0.01em; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); box-shadow: 6px 0 0 var(--gold); margin-right: 6px; }
.nav-links { display: flex; gap: 24px; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 15px; }
.nav-links a:hover { color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 14.5px var(--body); padding: 9px 16px; border-radius: 999px; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); background: transparent; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.btn:hover { background: var(--ink); color: var(--bg); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 64px; align-items: center; padding-block: 72px 24px; }
.hero-text { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.who { display: flex; align-items: center; gap: 14px; }
.sticker { width: 56px; height: 56px; flex: none; border-radius: 50%; overflow: hidden; background: var(--blue); color: var(--paper); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; box-shadow: 3px 3px 0 var(--gold); }
.sticker img { width: 100%; height: 100%; object-fit: cover; }
.who-t { display: flex; flex-direction: column; gap: 0; line-height: 1.3; }
.who-n { font-weight: 700; font-size: 17px; }
.who-r { color: var(--muted); font-size: 14.5px; }
.tag { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 5.6vw, 76px); line-height: 0.98; letter-spacing: -0.035em; margin: 0; text-wrap: balance; font-variation-settings: "opsz" 96; }
.tag-mark { color: var(--blue); }
.intro { margin: 0; max-width: 34em; font-size: 19px; color: var(--muted); white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mailchip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.copy { font: 500 12.5px var(--mono); color: var(--paper); background: var(--blue); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }

.mosaic { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; min-width: 0; }
.mosaic a { display: block; border-radius: 16px; overflow: hidden; transition: transform .25s ease; }
.mosaic a:nth-child(2) { transform: translateY(28px); }
.mosaic a:nth-child(4) { transform: translateY(28px); }
.mosaic a:hover { transform: translateY(-4px); }
.mosaic a:nth-child(2):hover, .mosaic a:nth-child(4):hover { transform: translateY(24px); }
.mosaic .art { aspect-ratio: 1 / 1; border-radius: 16px; }
.mosaic img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }

/* art covers */
.art { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background-color: var(--tint); background-image: radial-gradient(circle, color-mix(in srgb, var(--dot) 30%, transparent) 1.3px, transparent 1.8px); background-size: 15px 15px; }
.art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tone-0 { --tint: var(--blue-soft); --dot: var(--blue); }
.tone-1 { --tint: var(--gold-soft); --dot: var(--gold); }
.a-blue { fill: var(--blue); }
.a-gold { fill: var(--gold); }
.a-ink { fill: var(--ink); }
.a-paper { fill: var(--paper); }
.a-out { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.a-line { fill: var(--line); }
.a-mute { fill: var(--muted); opacity: 0.35; }
.a-stroke { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.a-txt { font: 500 12px var(--mono); fill: var(--ink); }
.a-txt-p { font: 500 12px var(--mono); fill: var(--paper); }

/* section heads */
.sec { padding-block: 120px 0; }
.sh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; margin: 0 0 56px; }
.sh .k { font-family: var(--mono); font-size: 13px; color: var(--blue); margin: 0 0 10px; }
.sh h2 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 4.4vw, 56px); letter-spacing: -0.03em; line-height: 1; margin: 0; }
.sh .sub { color: var(--muted); max-width: 26em; margin: 0; }

/* projects */
.projects { display: flex; flex-direction: column; gap: 112px; }
.proj { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; align-items: center; scroll-margin-top: 90px; }
.proj.flip .media { order: 2; }
.media { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 0; }
.media .art, .media figure:first-child { grid-column: 1 / -1; }
.media .art { border-radius: 20px; }
.media figure { margin: 0; position: relative; min-width: 0; }
.media img { display: block; width: 100%; height: auto; border-radius: 14px; background: var(--paper); }
.media figure:first-child img { aspect-ratio: 4 / 3; object-fit: cover; border-radius: 20px; }
.media figure:not(:first-child) img { aspect-ratio: 1 / 1; object-fit: cover; }
.media figcaption { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.txt { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.kind { font-family: var(--mono); font-size: 13px; color: var(--blue); margin: 0; }
.txt h3 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.02; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.txt .body { margin: 0; white-space: pre-line; font-size: 17.5px; }
.meta { margin: 8px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 22px; border-top: 1px solid var(--line); padding-top: 18px; font-size: 15.5px; }
.meta dt { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 3px; }
.meta dd { margin: 0; min-width: 0; }

/* toolkit */
.kit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.kit > div { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 28px; min-width: 0; }
.kit h3 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 14px; }
.sw { list-style: none; margin: 0; padding: 0; }
.sw li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.sw li:last-child { border-bottom: 0; }
.sw li::before { content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); }
.sw li:nth-child(even)::before { background: var(--gold); }

/* approach */
.ways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
.way { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.glyph { width: 44px; height: 44px; margin-bottom: 8px; }
.way h3 { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.15; margin: 0; letter-spacing: -0.015em; }
.way p { margin: 0; color: var(--muted); white-space: pre-line; }
.learn-h { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 64px 0 14px; }
.learn { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.learn li { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.learn .lm { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* contact */
.say { margin-top: 128px; background: var(--blue); color: var(--paper); border-radius: 28px; padding: 64px; display: flex; flex-direction: column; gap: 22px; position: relative; overflow: hidden; }
.say::before { content: ""; position: absolute; width: 340px; aspect-ratio: 1; border-radius: 50%; right: -90px; top: -120px; background: var(--gold); }
.say::after { content: ""; position: absolute; width: 180px; aspect-ratio: 1; border-radius: 50%; right: 150px; bottom: -110px; border: 2px solid color-mix(in srgb, var(--paper) 40%, transparent); }
.say > * { position: relative; z-index: 1; }
.say .k { font-family: var(--mono); font-size: 13px; margin: 0; opacity: 0.8; }
.say h2 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 88px); line-height: 0.95; letter-spacing: -0.04em; margin: 0; max-width: 9em; }
.say .row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.say .mailchip { background: var(--paper); color: var(--ink); border: 0; }
.say .btn { border-color: var(--paper); color: var(--paper); }
.say .btn:hover { background: var(--paper); color: var(--blue); }
.say .loc { opacity: 0.8; font-size: 15px; }
.foot { color: var(--muted); font-size: 14px; padding-block: 28px 56px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* edit mode */
[contenteditable] { outline: 1px dashed color-mix(in srgb, var(--blue) 60%, transparent); outline-offset: 3px; border-radius: 2px; cursor: text; min-width: 2ch; }
[contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); opacity: 0.7; }
[contenteditable]:focus { outline: 2px solid var(--blue); background: color-mix(in srgb, var(--gold) 16%, transparent); }
.say [contenteditable] { outline-color: var(--paper); }
.ed-ctl { font: 500 12px var(--mono); color: var(--blue); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.ed-ctl:hover { border-color: var(--blue); }
.ed-add { align-self: flex-start; margin-top: 14px; }
.ed-row { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.ed-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ed-hint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin: 2px 0 0; }
.ed-field { display: flex; flex-direction: column; gap: 2px; }
.ed-field small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.img-ctl { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 2; }
.has-bar body { padding-bottom: 76px; }
.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgb(0 0 0 / 0.08); font-family: var(--body); font-size: 14.5px; }
.eb-who { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.eb-status { flex: 1 1 200px; color: var(--muted); min-width: 0; }
.editbar button { font: 700 14px var(--body); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.editbar .eb-primary { background: var(--blue); border-color: var(--blue); color: var(--paper); }
.editbar button:disabled { opacity: 0.45; cursor: default; }

@media (max-width: 980px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 48px; padding-block: 48px 24px; }
  .mosaic a:nth-child(2), .mosaic a:nth-child(4) { transform: none; }
  .mosaic a:nth-child(2):hover, .mosaic a:nth-child(4):hover { transform: translateY(-4px); }
  .proj { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .proj.flip .media { order: 0; }
  .kit, .ways { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .ways { gap: 36px; }
  .say { padding: 44px 32px; }
}
@media (max-width: 640px) {
  .shell { padding-inline: 16px; }
  .nav-links { display: none; }
  .nav-in { gap: 12px; }
  .btn { padding: 8px 13px; font-size: 13.5px; }
  .sec { padding-block: 88px 0; }
  .projects { gap: 80px; }
  .intro { font-size: 17.5px; }
  .mosaic { gap: 10px; }
  .say { padding: 36px 22px; border-radius: 22px; margin-top: 96px; }
  .say::before { width: 220px; right: -90px; top: -90px; }
}
</style>

function readImg(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1400, sc = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        var x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

  if (html.length > 15500000) { setStatus('The page is too large to save. Remove an image or two and try again.'); return; }

  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) {}

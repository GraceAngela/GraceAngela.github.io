<style id="css">/* Layout: sticky top nav; a two-column hero (statement left, a dark "governance console" listing owned services right);
   a figures strip; one featured case study with a flow diagram, then a two-column grid of case cards; closing contact band. */
/* Palette: Grace's own five colours (mist #EEEEEE, taupe #D7CEC7, camel #C09F80, wine #76323F, oxblood #512323).
   Type: League Spartan (heavy geometric, uppercase) for headlines, Hanken Grotesk for reading, Newsreader serif for labels and tags. */
:root {
  --bg: #eeeeee;
  --surface: #f8f7f6;
  --ink: #2b1416;
  --muted: #6a5552;
  --line: #d7cec7;
  --accent: #76323f;
  --accent-soft: #e9dcdc;
  --tan: #c09f80;
  --warm: #76323f;
  --con-bg: #512323;
  --con-ink: #eeeeee;
  --con-muted: #d7cec7;
  --con-line: #6a3436;
  --signal: #c09f80;
  --display: "League Spartan", "Futura", "Avenir Next", system-ui, sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Newsreader", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1113; --surface: #2a181b; --ink: #eeeeee; --muted: #bfb1ab; --line: #3d2629;
    --accent: #d48a98; --accent-soft: #3a2025; --tan: #c09f80; --warm: #c9a886;
    --con-bg: #512323; --con-ink: #eeeeee; --con-muted: #d7cec7; --con-line: #6a3436; --signal: #c9a886; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1113; --surface: #2a181b; --ink: #eeeeee; --muted: #bfb1ab; --line: #3d2629;
  --accent: #d48a98; --accent-soft: #3a2025; --tan: #c09f80; --warm: #c9a886;
  --con-bg: #512323; --con-ink: #eeeeee; --con-muted: #d7cec7; --con-line: #6a3436; --signal: #c9a886; color-scheme: dark;
}
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 76px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.shell { max-width: 1200px; margin: 0 auto; padding-inline: 32px; }

/* nav */
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.nav-in { display: flex; align-items: center; gap: 28px; height: 60px; }
.brand { font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--ink); text-decoration: none; letter-spacing: 0.005em; margin-right: auto; white-space: nowrap; }
.nav-links { display: flex; gap: 24px; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14.5px; }
.nav-links a:hover { color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 500 14px var(--body); padding: 9px 16px; border-radius: 8px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; white-space: nowrap; transition: border-color .15s, transform .15s; }
.btn:hover { border-color: var(--accent); }
.btn-solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-solid:hover { transform: translateY(-1px); border-color: var(--ink); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); gap: 56px; align-items: center; padding-block: 72px 56px; }
.hero-text { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.avatar { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--display); font-weight: 400; font-size: 30px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.eyebrow-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.eyebrow { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.02em; margin: 0; }
.org { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0; }
.name { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 7.6vw, 100px); line-height: 0.95; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.lede { font-size: clamp(18px, 1.7vw, 21px); line-height: 1.55; margin: 0; max-width: 33em; color: var(--ink); text-wrap: pretty; white-space: pre-line; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
.mailchip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.copy { font: 500 12.5px var(--mono); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.where { color: var(--muted); font-size: 14px; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.badge { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-family: var(--mono); font-size: 12px; padding: 5px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 0; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* console */
.console { background: var(--con-bg); color: var(--con-ink); border-radius: 14px; padding: 8px 0 0; box-shadow: 0 30px 60px -30px rgb(81 35 35 / 0.55); min-width: 0; overflow: hidden; }
.con-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 22px 14px; border-bottom: 1px solid var(--con-line); font-family: var(--mono); font-size: 12px; color: var(--con-muted); }
.con-head .dots { display: inline-flex; gap: 6px; }
.con-head .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--con-line); display: block; }
.con-title { padding: 18px 22px 4px; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--con-muted); }
.crow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 16px 22px; border-bottom: 1px solid var(--con-line); }
.crow:last-of-type { border-bottom: 0; }
.crow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--signal); margin-top: 8px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--signal) 18%, transparent); }
.crow .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.crow .n { font-weight: 600; font-size: 16px; }
.crow .pill { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--signal) 55%, transparent); color: var(--signal); }
.crow .note { grid-column: 2; color: var(--con-muted); font-size: 14px; line-height: 1.45; }
.con-foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px 22px; background: color-mix(in srgb, var(--con-line) 45%, transparent); font-family: var(--mono); font-size: 11.5px; color: var(--con-muted); }
.console [contenteditable]:focus { background: color-mix(in srgb, var(--signal) 15%, transparent); }

/* figures */
.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--tan); border-radius: 14px; }
.facts li { padding: 22px 24px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.facts li + li { border-left: 1px solid var(--line); }
.facts .v { color: var(--accent); font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.facts .l { color: var(--muted); font-size: 14px; line-height: 1.4; }

/* sections */
.sec { padding-block: 104px 0; }
.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 32px; margin: 0 0 40px; }
.sec-h .k { font-family: var(--mono); font-size: 12.5px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 10px; }
.sec-h h2 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 4.4vw, 56px); line-height: 1.05; margin: 0; letter-spacing: -0.015em; }
.sec-h .sub { color: var(--muted); max-width: 30em; margin: 0; font-size: 16px; }

/* featured case */
.feature { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
.feature .ft { padding: 40px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.feature .fv { background: var(--accent-soft); padding: 36px 28px; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; border-left: 1px solid var(--line); }
.feature h3 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 3.4vw, 46px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.feature .sum { font-size: 17.5px; }
.fig-cap { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
.flow { width: 100%; height: auto; display: block; }
.flow-v { display: none; max-width: 340px; margin: 0 auto; }
.flow .bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.flow .bx-a { fill: var(--accent); stroke: var(--accent); }
.flow .bx-d { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.flow .t { fill: var(--ink); font: 600 14px var(--body); }
.flow .t-a { fill: var(--surface); font: 600 14px var(--body); }
.flow .s { fill: var(--muted); font: 400 11.5px var(--mono); }
.flow .s-a { fill: var(--surface); font: 400 11.5px var(--mono); opacity: 0.85; }
.flow .ln { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.flow .hd { fill: var(--accent); }

/* case cards */
.case-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: border-color .2s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.kicker { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.03em; margin: 0; }
.case-grid .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
.card h3 { font-family: var(--body); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; line-height: 1.18; margin: 0; text-wrap: balance; }
.sum { margin: 0; font-size: 16px; color: var(--ink); white-space: pre-line; }
.pts { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.pts li { position: relative; padding-left: 22px; color: var(--muted); font-size: 15px; line-height: 1.55; }
.pts li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 12px; height: 7px; border-left: 1.6px solid var(--accent); border-bottom: 1.6px solid var(--accent); transform: rotate(-45deg) scale(0.75); transform-origin: left top; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 0; padding: 12px 0 0; list-style: none; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 6px; background: color-mix(in srgb, var(--tan) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tan) 45%, var(--line)); color: var(--ink); }

/* skills */
.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; min-width: 0; }
.skill h3 { font-family: var(--body); font-size: 17px; font-weight: 600; margin: 0 0 14px; line-height: 1.2; }
.skill .chips { margin: 0; padding: 0; }

/* recognition */
.awards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 56px; }
.award { position: relative; background: var(--con-bg); color: var(--con-ink); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow: hidden; }
.award::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--signal) 40%, transparent); box-shadow: 0 0 0 22px color-mix(in srgb, var(--signal) 7%, transparent); }
.award .m { font-family: var(--mono); font-size: 12px; color: var(--signal); margin: 0; position: relative; }
.award .t { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.12; margin: 0; position: relative; }
.award .x { color: var(--con-muted); font-size: 15.5px; margin: 0; white-space: pre-line; position: relative; max-width: 30em; }
.subh { font-family: var(--body); font-size: 19px; font-weight: 600; margin: 0 0 20px; }
.cert-groups { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.cg h4 { font-family: var(--mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 0 0 6px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--tan); padding-bottom: 8px; }
.cg ul, .certs { list-style: none; margin: 0; padding: 0; }
.cg li { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
.cg li small { display: block; color: var(--muted); font-size: 12.5px; }
.certs li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.certs .cn { font-weight: 500; }
.certs .cm { font-size: 13px; color: var(--muted); }

/* beyond + education */
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 56px; }
.split.solo { grid-template-columns: minmax(0, 1fr); }
.split.solo .edu { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 6px 28px; }
.split.solo .edu .d { order: 1; } .split.solo .edu .s { order: 2; flex: 1 1 260px; } .split.solo .edu .y { order: 3; }
.beyond { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.beyond > div { border-top: 2px solid var(--tan); padding-top: 16px; min-width: 0; }
.beyond h3 { font-size: 17px; margin: 0 0 6px; font-weight: 600; line-height: 1.35; }
.beyond p { margin: 0; color: var(--muted); font-size: 15px; white-space: pre-line; }
.edu { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px; display: flex; flex-direction: column; gap: 6px; }
.edu .d { font-family: var(--body); font-weight: 600; font-size: 19px; line-height: 1.2; margin: 0; }
.edu .s { color: var(--muted); margin: 0; font-size: 15px; }
.edu .y { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.h3s { font-family: var(--display); font-size: 32px; font-weight: 400; margin: 0 0 20px; }

/* contact band */
.cta { margin-top: 112px; background: var(--con-bg); color: var(--con-ink); border-radius: 20px; padding: 56px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: end; position: relative; overflow: hidden; }
.cta::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--con-line) 1px, transparent 1px), linear-gradient(90deg, var(--con-line) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.45; -webkit-mask-image: linear-gradient(120deg, transparent 35%, #000); mask-image: linear-gradient(120deg, transparent 35%, #000); pointer-events: none; }
.cta > * { position: relative; }
.cta h2 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(44px, 5.6vw, 72px); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 12px; }
.cta p { color: var(--con-muted); margin: 0; font-size: 17px; max-width: 28em; white-space: pre-line; }
.cta-links { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.cta .mailchip { background: color-mix(in srgb, var(--con-line) 60%, transparent); border-color: var(--con-line); color: var(--con-ink); }
.cta .copy { background: var(--signal); color: var(--con-bg); }
.cta .btn { background: transparent; color: var(--con-ink); border-color: var(--con-line); }
.cta .btn:hover { border-color: var(--signal); }
.foot { color: var(--muted); font-size: 13.5px; padding-block: 28px 56px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

/* edit mode */
[contenteditable] { outline: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; border-radius: 2px; cursor: text; min-width: 2ch; }
[contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); opacity: 0.7; }
[contenteditable]:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
.ed-ctl { font: 500 12px var(--mono); color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.ed-ctl:hover { border-color: var(--accent); }
.ed-add { align-self: flex-start; margin-top: 14px; }
.ed-row { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.ed-hint { font-family: var(--mono); font-size: 11.5px; color: var(--warm); margin: 4px 0 0; }
.ed-line { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.ed-field { display: flex; flex-direction: column; gap: 2px; }
.ed-field small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.has-bar body { padding-bottom: 76px; }
.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgb(0 0 0 / 0.08); font-family: var(--body); font-size: 14px; }
.eb-who { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.eb-status { flex: 1 1 200px; color: var(--muted); min-width: 0; }
.editbar button { font: 500 14px var(--body); padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.editbar .eb-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.editbar button:disabled { opacity: 0.45; cursor: default; }

@media (max-width: 1020px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-block: 48px 40px; }
  .feature { grid-template-columns: minmax(0, 1fr); }
  .feature .fv { border-left: 0; border-top: 1px solid var(--line); }
  .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cert-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: minmax(0, 1fr); gap: 48px; }
  .cta { grid-template-columns: minmax(0, 1fr); padding: 40px; }
}
@media (max-width: 760px) {
  .shell { padding-inline: 16px; }

.edu .y { font-size: 15px; font-style: italic; }
.ed-ctl, .ed-hint, .eb-who, .ed-field small { font-size: 13px; }
.flow .s, .flow .s-a { font: italic 400 13px var(--mono); }

/* ---- trimmed layout ---- */
.skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.edu-wide { flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 32px; }
.edu-wide .y { order: 2; }
.crow:last-of-type { padding-bottom: 22px; }
@media (max-width: 760px) {
  .facts { grid-template-columns: minmax(0, 1fr); }

  .facts li:nth-child(3) { border-left: 0; }

var IS_SITE = typeof SITE_HEAD !== 'undefined';
if (typeof SITE_PATH === 'undefined') var SITE_PATH = '';
var CE = (function () { var d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; } catch (e) {} return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; })();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function get(p) { return p.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, S); }
function setP(p, v) { var ks = p.split('.'); var last = ks.pop(); var o = ks.reduce(function (o, k) { return o[k]; }, S); o[last] = v; }
function has(p) { var v = get(p); return v != null && String(v).trim() !== ''; }
function list(s) { return String(s || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }

/* editable text: T(path, tag, class, placeholder, singleLine) */
function T(p, tag, cls, ph, single) {
  tag = tag || 'span';
  var v = get(p); v = v == null ? '' : v;
  if (!editing && !String(v).trim()) return '';
  var a = ' class="' + (cls || '') + '" data-path="' + p + '"';
  if (editing) a += ' contenteditable="' + CE + '" spellcheck="true" data-ph="' + esc(ph || 'Add text') + '"' + (single ? ' data-single="1"' : '');
  return '<' + tag + a + '>' + esc(v) + '</' + tag + '>';
}
/* edit-mode controls */
function ctl(act, path, label, extra) { return editing ? '<button type="button" class="ed-ctl" data-act="' + act + '" data-path="' + path + '"' + (extra || '') + '>' + label + '</button>' : ''; }
function rowCtl(arrPath, i, n) {
  if (!editing) return '';
  return '<span class="ed-row">' + (i > 0 ? ctl('up', arrPath + '.' + i, '↑', ' aria-label="Move up"') : '') + (i < n - 1 ? ctl('down', arrPath + '.' + i, '↓', ' aria-label="Move down"') : '') + ctl('del', arrPath + '.' + i, 'Remove') + '</span>';
}
function addCtl(arrPath, tpl, label) { return editing ? '<button type="button" class="ed-ctl ed-add" data-act="add" data-path="' + arrPath + '" data-tpl="' + tpl + '">+ ' + label + '</button>' : ''; }
function hint(text) { return editing ? '<p class="ed-hint">' + text + '</p>' : ''; }

function paint() { document.getElementById('root').innerHTML = render(); document.documentElement.classList.toggle('is-editing', editing); }

function readImg(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 1400, sc = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        var x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---- events ---- */
document.addEventListener('input', function (e) {
  var el = e.target.closest && e.target.closest('[data-path][contenteditable]');
  if (!el) return;
  setP(el.dataset.path, el.innerText.replace(/ /g, ' ').replace(/\n{3,}/g, '\n\n').trim());
  markDirty();
});
document.addEventListener('keydown', function (e) {
  var el = e.target.closest && e.target.closest('[data-single]');
  if (el && e.key === 'Enter') e.preventDefault();
});
document.addEventListener('paste', function (e) {
  var el = e.target.closest && e.target.closest('[data-path][contenteditable]');
  if (!el || CE === 'plaintext-only') return;
  e.preventDefault();
  var t = (e.clipboardData || window.clipboardData).getData('text');
  document.execCommand('insertText', false, t);
});
document.addEventListener('click', function (e) {
  var cp = e.target.closest('[data-copy]');
  if (cp) { copyText(cp.getAttribute('data-copy'), cp); return; }
  var b = e.target.closest('[data-act]');
  if (!b || !editing) return;
  var act = b.dataset.act, p = b.dataset.path;
  if (act === 'add') { get(p).push(JSON.parse(JSON.stringify(TPL[b.dataset.tpl]))); }
  else if (act === 'del' || act === 'up' || act === 'down') {
    var ks = p.split('.'), i = +ks.pop(), arr = get(ks.join('.'));
    if (act === 'del') arr.splice(i, 1);
    else { var j = act === 'up' ? i - 1 : i + 1; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  }
  else if (act === 'toggle') { setP(p, !get(p)); }
  else if (act === 'clear') { setP(p, ''); }
  else if (act === 'set') { setP(p, b.dataset.val); }
  else if (act === 'img' || act === 'photo') {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; if (act === 'img') inp.multiple = true;
    inp.onchange = function () {
      var files = Array.prototype.slice.call(inp.files || []);
      setStatus('Adding ' + (files.length > 1 ? files.length + ' images' : 'image') + '…');
      Promise.all(files.map(readImg)).then(function (srcs) {
        if (act === 'photo') setP(p, srcs[0] || '');
        else srcs.forEach(function (s) { get(p).push({ src: s, cap: '' }); });
        markDirty(); paint(); setStatus('Image added. Save to publish it.');
      }).catch(function () { setStatus('That file couldn’t be read as an image. Try a JPG or PNG.'); });
    };
    inp.click(); return;
  }
  markDirty(); paint();
});

function copyText(t, btn) {
  var done = function () { var o = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = o; }, 1600); };
  try {
    navigator.clipboard.writeText(t).then(done, function () { selectNear(btn); });
  } catch (e) { selectNear(btn); }
}
function selectNear(btn) { var el = btn.parentNode.querySelector('.copy-src'); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---- edit bar ---- */
var bar;
function setStatus(t) { if (bar) bar.querySelector('.eb-status').textContent = t || ''; }
function markDirty() { dirty = true; if (bar) bar.querySelector('[data-eb=save]').disabled = false; }
function showBar() {
  bar = document.createElement('div');
  bar.className = 'editbar'; bar.setAttribute('role', 'toolbar'); bar.setAttribute('aria-label', 'Edit this page');
  bar.innerHTML = '<span class="eb-who">' + (IS_SITE ? 'Edit mode · changes stay on this computer' : 'Only you see this bar') + '</span><span class="eb-status" aria-live="polite"></span>' +
    '<button type="button" data-eb="restore" hidden>Restore unsaved edits</button>' +
    '<button type="button" data-eb="cancel" hidden>Discard</button>' +
    '<button type="button" data-eb="save" class="eb-primary" hidden disabled>' + (IS_SITE ? 'Download updated page' : 'Save &amp; publish') + '</button>' +
    '<button type="button" data-eb="edit" class="eb-primary">Edit page</button>';
  document.body.appendChild(bar);
  document.documentElement.classList.add('has-bar');
  var q = function (k) { return bar.querySelector('[data-eb=' + k + ']'); };
  if (draft) q('restore').hidden = false;
  q('edit').onclick = function () { editing = true; paint(); q('edit').hidden = true; q('save').hidden = false; q('cancel').hidden = false; setStatus('Click any text to change it.'); };
  q('cancel').onclick = function () { S = JSON.parse(STATE_TEXT); editing = false; dirty = false; paint(); q('edit').hidden = false; q('save').hidden = true; q('save').disabled = true; q('cancel').hidden = true; setStatus('Changes discarded.'); };
  q('restore').onclick = function () { try { S = JSON.parse(draft); } catch (e) { return; } q('restore').hidden = true; q('edit').onclick(); markDirty(); setStatus('Unsaved edits restored. Save to publish them.'); };
  q('save').onclick = save;
}
function save() {
  var html = buildDoc();
  if (IS_SITE) {
    try {
      var blob = new Blob([html], { type: 'text/html' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) {}
      setStatus('Downloaded index.html. Upload it to GitHub, replacing the old ' + (SITE_PATH || 'index.html') + ', to update your site.');
    } catch (err) { setStatus('Couldn’t create the file. Try another browser.'); }
    return;
  }
  if (html.length > 15500000) { setStatus('The page is too large to save. Remove an image or two and try again.'); return; }
  setStatus('Publishing…'); bar.querySelector('[data-eb=save]').disabled = true;
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) {}
  art.publish(html).then(function () { setStatus('Published. Reloading…'); }, function (err) {
    var c = err && err.code; bar.querySelector('[data-eb=save]').disabled = false;
    if (c === 'conflict') setStatus('A newer version was saved somewhere else. The page will reload to it; use “Restore unsaved edits” to get your changes back.');
    else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'not_declared' || c === 'capability_removed') setStatus('This view is read-only, so changes can’t be saved here. Open the page from your own Claude account to edit.');
    else if (c === 'too_large') setStatus('The page is too large to save. Remove an image or two and try again.');
    else if (c === 'rate_limited') setStatus('Saved too often in a short time. Wait a minute, then save again.');
    else setStatus('Couldn’t publish just now. Check your connection and save again.');
  });
}
function buildDoc() {
  var json = JSON.stringify(S).replace(/</g, '\\u003c');
  var css = document.getElementById('css').textContent;
  var js = document.getElementById('app').textContent;
  var C = '</' + 'script>';
  if (IS_SITE) return SITE_HEAD + '<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">' + json + C + '\n<script id="app">' + js + C + '\n</body>\n</html>\n';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
    PRE + '<style id="css">' + css + '</style>\n<div id="root"></div>\n<script type="application/json" id="state">' + json + C + '\n<script id="app">' + js + C + '\n</body></html>';
}

/* ---- boot ---- */
try { var d = sessionStorage.getItem(DRAFT_KEY); if (d) { if (d === JSON.stringify(S)) sessionStorage.removeItem(DRAFT_KEY); else draft = d; } } catch (e) {}
paint();
function siteEdit() { if (IS_SITE && !bar && location.hash === '#edit') { art = {}; showBar(); } }
if (IS_SITE) { siteEdit(); window.addEventListener('hashchange', siteEdit); }
(function () {
  if (IS_SITE || !window.claude || typeof window.claude.use !== 'function') return;
  Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (r) {
    var u = r[0], a = r[1];
    if (!u || !a) return;
    return Promise.all([u.isOwner(), u.canEdit()]).then(function (ok) {
      if (ok[0] || ok[1]) { art = a; showBar(); }
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
